<div class="farming-page">
  <app-home-sidebar />
  <app-home-header />
  <main>
    <h1 class="sr-only">IoT Sensors</h1>
    <app-sensor-overview [categories]="categories" />
    <app-sensor-equipment
      [categories]="categories"
      [sensors]="filtered()"
      [(query)]="query"
      [(category)]="category"
      (addRequested)="adding.set(true)"
      (sensorSelected)="selected.set($event)"
    />
  </main>
</div>
<svg class="svg-defs" aria-hidden="true">
  <defs>
    <linearGradient id="green">
      <stop stop-color="#4fb063" />
      <stop offset="1" stop-color="#84e498" />
    </linearGradient>
    <g id="weather" stroke="url(#green)" stroke-width="5" fill="none">
      <circle cx="39" cy="37" r="24" />
      <ellipse cx="39" cy="37" rx="11" ry="24" />
      <path d="M15 37h48M20 23h38M20 51h28M39 6V0M7 37H0M15 12 8 5M67 12l7-7M13 65l-7 7" />
      <path
        d="M47 83h34a13 13 0 0 0 0-26 19 19 0 0 0-36 4 11 11 0 0 0 2 22Z"
        fill="url(#green)"
        stroke="none"
      />
    </g>
  </defs>
</svg>
<app-sensor-dialog
  [adding]="adding()"
  [selected]="selected()"
  (closed)="adding.set(false); selected.set(null)"
  (submitted)="add($event)"
/>
