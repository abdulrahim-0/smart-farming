<main class="login-page">
  <a class="brand" href="./" aria-label="Smart Farming home">
    <svg class="brand-mark" viewBox="0 0 60 60" fill="none" aria-hidden="true">
      <path
        d="M29 55C14 55 4 44 4 30S15 5 29 5"
        stroke="currentColor"
        stroke-width="6"
        stroke-linecap="round"
      />
      <path
        d="M29 47V27M29 37C17 38 13 31 13 22c11-1 17 4 16 15ZM30 29c0-11 7-17 18-16 1 10-6 17-18 16Z"
        fill="currentColor"
      />
      <path
        d="M38 5c7 0 14 4 17 10M40 12c4 0 7 2 9 5"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
      />
      <circle cx="43" cy="21" r="2" fill="currentColor" />
    </svg>
    <span>Smart Farming</span>
  </a>

  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-content">
      <header>
        <h1 id="login-title">Admin Login,</h1>
        <p>Enter admin credentials to login</p>
      </header>

      <form (submit)="login($event)">
        <label class="text-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="5" width="20" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
          </span>
          <span class="sr-only">Email Address</span>
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            autocomplete="username"
            required
            (input)="clearMessage()"
          />
        </label>

        <label class="text-field password-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="4" y="10" width="16" height="12" rx="2" />
              <path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3" />
            </svg>
          </span>
          <span class="sr-only">Password</span>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            (input)="clearMessage()"
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="togglePasswordVisibility()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
              @if (passwordVisible()) {
                <path d="m3 3 18 18" />
              }
            </svg>
          </button>
        </label>

        <button class="login-button" type="submit">
          Login
          <span class="button-arrow" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" /></svg
          ></span>
        </button>
      </form>

      <button class="forgot-password" type="button" (click)="recoverPassword()">
        Forgot Password?
      </button>
      <p class="status-message" role="status">{{ message() }}</p>
    </div>
  </section>

  <aside class="farm-banner" aria-label="Green farmland"></aside>
  <footer>Smart Farming, Riyadh, KSA</footer>
</main>
